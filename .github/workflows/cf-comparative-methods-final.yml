name: SCOVA-CF two-group comparative methods final study

# Frozen descriptive simulation evidence only. This workflow cannot dispatch a
# qualification, calibration, external-agreement, inference, or promotion lane.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparative-methods-final-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        cell_id:
          - cmp-v1-linear-linear-adequate
          - cmp-v1-linear-linear-poor
          - cmp-v1-linear-nonlinear-adequate
          - cmp-v1-linear-nonlinear-poor
          - cmp-v1-interaction-linear-adequate
          - cmp-v1-interaction-linear-poor
          - cmp-v1-interaction-nonlinear-adequate
          - cmp-v1-interaction-nonlinear-poor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r benchmarks/requirements-cf-validation.txt
      - run: python -m pip install -e . --no-deps
      - name: Run frozen final descriptive shard
        env:
          CELL_ID: ${{ matrix.cell_id }}
        run: >-
          python -m benchmarks.cf_comparative_methods
          --replications 1000 --cell-id "$CELL_ID"
          --output "evidence/shards/$CELL_ID.json"
      - uses: actions/upload-artifact@v6
        with:
          name: cf-comparative-v2-final-shard-${{ matrix.cell_id }}
          path: evidence/shards/${{ matrix.cell_id }}.json
          retention-days: 365

  comparative-methods-final-aggregate:
    needs: comparative-methods-final-shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r benchmarks/requirements-cf-validation.txt
      - run: python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v6
        with:
          pattern: cf-comparative-v2-final-shard-*
          path: evidence/shards
          merge-multiple: true
      - name: Aggregate frozen final shards
        run: >-
          python -m benchmarks.cf_comparative_methods
          --aggregate-input evidence/shards/*.json
          --output evidence/cf-comparative-methods-v2-final.json
      - run: >-
          python -m scripts.render_cf_comparative_methods_report
          --artifact evidence/cf-comparative-methods-v2-final.json
          --output evidence/cf-comparative-methods-v2-final.md
      - uses: actions/upload-artifact@v6
        with:
          name: cf-comparative-methods-v2-final
          path: evidence/cf-comparative-methods-v2-final.*
          retention-days: 365
