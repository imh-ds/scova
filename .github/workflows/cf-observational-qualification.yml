name: SCOVA-CF prospective observational qualification

# This is intentionally undispatched.  A run requires the recorded owner and
# independent-reviewer approval named in the methodological contract.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Frozen qualification lane
        required: true
        type: choice
        options: [pilot, calibration, validation]
      approval_record:
        description: Exact approval token after recorded human review
        required: true
        type: string

permissions:
  contents: read

jobs:
  approval_gate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ inputs.approval_record }}" = "owner-and-independent-reviewer-recorded"
  qualification:
    needs: approval_gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12.13
      - run: python -m pip install -r benchmarks/requirements-cf-validation.txt
      - run: python -m pip install -e . --no-deps
      - run: >-
          python -m benchmarks.cf_qualification_program
          --write-spec evidence/cf-observational-qualification-frozen-spec.json
      - run: >-
          python -m benchmarks.cf_qualification_program --lane '${{ inputs.lane }}'
          --output evidence/cf-observational-qualification-${{ inputs.lane }}.json
      - run: >-
          python -m scripts.render_cf_study_report
          --artifact evidence/cf-observational-qualification-${{ inputs.lane }}.json
          --output evidence/cf-observational-qualification-${{ inputs.lane }}.md
      - uses: actions/upload-artifact@v6
        with:
          name: cf-observational-qualification-${{ inputs.lane }}
          path: evidence/
          retention-days: 90
