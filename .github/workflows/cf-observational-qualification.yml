name: SCOVA-CF prospective observational qualification

# This is intentionally undispatched. A run fails closed unless the frozen
# decision manifest links every material blocker to recorded independent review.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Frozen qualification lane
        required: true
        type: choice
        options: [pilot, calibration, validation]

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12.13
      - run: python -m pip install -r benchmarks/requirements-cf-validation.txt
      - run: python -m pip install -e . --no-deps
      - run: >-
          python -m benchmarks.cf_qualification_program
          --write-spec evidence/cf-observational-qualification-frozen-spec.json
      - run: >-
          python -m scripts.write_cf_scope_manifest
          --spec evidence/cf-observational-qualification-frozen-spec.json
          --contract docs/scova_cf_methodological_contract.md
          --output evidence/cf-observational-qualification-decisions.json
      - run: >-
          python -m scripts.render_cf_scope_decisions
          --registry src/scova/cf/data/scope_decisions.json
          --output evidence/cf-observational-scope-decisions.md
      - run: >-
          python -m scripts.check_cf_scope_decisions
          --spec evidence/cf-observational-qualification-frozen-spec.json
          --contract docs/scova_cf_methodological_contract.md
          --manifest evidence/cf-observational-qualification-decisions.json
      - run: >-
          python -m benchmarks.cf_qualification_program --lane '${{ inputs.lane }}'
          --decision-manifest evidence/cf-observational-qualification-decisions.json
          --output evidence/cf-observational-qualification-${{ inputs.lane }}.json
      - run: >-
          python -m scripts.render_cf_study_report
          --artifact evidence/cf-observational-qualification-${{ inputs.lane }}.json
          --output evidence/cf-observational-qualification-${{ inputs.lane }}.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cf-observational-qualification-${{ inputs.lane }}
          path: evidence/
          retention-days: 90
